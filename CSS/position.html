<html>
    <head>
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            .box{
                height: 400px;
                width: 400px;

            }
            .box1{
                height: 100px;
                width: 100px;

            }
            .p{
                position: absolute;
                top: 50px;
                right: 50px;
            }
            .bg-red{
                background-color: red;
                width: 100%;
            }
            .bg-green{
                background-color: green;
            }
             .bg-yellow{
                background-color: yellow;
            }
            .h{
                position: relative;

            }
        </style>
    </head>
    <body>
        <div class="box bg-green h" >
            <div class="box1 bg-red p "></div>
        </div>
        
        <div class="box bg-yellow">
            Hello how are you?
        </div>
    </body>
</html>
