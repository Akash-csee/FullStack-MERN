<html>
    <head>
        <style>
            .box{
                height: 400px;
                width: 400px;
                background-color: red;
                animation: Akash 10s infinite;
            }
            @keyframes Akash {
                0%{}
                25%{
                    background-color: yellow;
                    margin-left: 200px;
                    /* margin-top: 100px; */
                    transform: rotate(90deg);
                    
                }
                50%{
                    background-color: green;
                    margin-left: 400px;
                    /* margin-top: 200px; */
                    transform: rotate(180deg);
                    
                }
                100%{
                    background-color: pink;
                    margin-left: 1000px;
                    margin-top: 400px;
                    transform: rotate(360deg);
                }

                
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
    </body>
</html>
